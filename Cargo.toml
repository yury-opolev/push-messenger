[workspace]
resolver = "3"
members = [
    "bindings/c",
    "bindings/ffi",
    "bindings/node",
    "crates/push-agent-key",
    "crates/push-auth",
    "crates/push-auth-core",
    "crates/push-credentials",
    "crates/push-domain",
    "crates/push-email",
    "crates/push-gateway",
    "crates/push-load",
    "crates/push-message-svc",
    "crates/push-proto",
    "crates/push-sdk",
    "crates/push-smoke",
    "crates/push-store",
    "crates/push-testkit",
    "crates/push-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yury-opolev/push-messenger"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.12"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
jsonwebtoken = { version = "9", default-features = false }
libtest-mimic = "0.8"
prost = "0.14"
protoc-bin-vendored = "3"
push-agent-key = { path = "crates/push-agent-key" }
push-auth-core = { path = "crates/push-auth-core" }
push-credentials = { path = "crates/push-credentials" }
push-domain = { path = "crates/push-domain" }
push-email = { path = "crates/push-email" }
push-gateway = { path = "crates/push-gateway" }
push-load = { path = "crates/push-load" }
push-message-svc = { path = "crates/push-message-svc" }
push-proto = { path = "crates/push-proto" }
push-sdk = { path = "crates/push-sdk" }
push-sdk-c = { path = "bindings/c" }
push-sdk-ffi = { path = "bindings/ffi" }
push-store = { path = "crates/push-store" }
push-testkit = { path = "crates/push-testkit" }
push-worker = { path = "crates/push-worker" }
rand = "0.9"
rcgen = "0.13"
redis = { version = "1", default-features = false, features = [
    "connection-manager",
    "tokio-comp",
    "tokio-rustls-comp",
    "token-based-authentication",
] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ring = "0.17"
# 0.32 links libsqlite3-sys 0.30, the version sqlx 0.8 names: two crates linking
# sqlite3 cannot share a lockfile, even when sqlx's SQLite driver is off. Not `bundled`:
# push-sdk compiles SQLite3 Multiple Ciphers itself and libsqlite3-sys links to it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.32", features = ["modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "uuid",
] }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zeroize = "1"

[profile.dev]
debug = "line-tables-only"
incremental = false

# Argon2id is far too slow unoptimised, and the auth tests hash many passwords.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
