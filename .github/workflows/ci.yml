name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # push-smoke's tests turn on push-bridge's `voice` feature above; lint it without too.
      - run: cargo clippy -p push-bridge --all-targets --locked -- -D warnings
      # The integration tests start these images through the runner's Docker.
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo test --workspace --locked

  # The crates build with the oldest supported Rust (rust-version). Tests run on stable
  # above: their dev-dependencies (testcontainers) need a newer Rust, which consumers
  # never compile.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked

  # The voice adapter protocol's decoders under libFuzzer (docs/voice-adapter-protocol.md):
  # a short smoke run of each cargo-fuzz target on nightly. The crate's own tests run the
  # proptest equivalents in the rust job; longer runs are manual (`cargo +nightly fuzz run
  # frames` in crates/push-voice-adapter-proto).
  voice-adapter-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/push-voice-adapter-proto/fuzz -> target"
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run frames -- -max_total_time=60
        working-directory: crates/push-voice-adapter-proto
      - run: cargo fuzz run messages -- -max_total_time=30
        working-directory: crates/push-voice-adapter-proto

  # Known vulnerabilities, licences and sources of the Rust dependencies (deny.toml), and
  # known vulnerabilities of the Node binding's runtime dependencies.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm audit --omit=dev
        working-directory: bindings/node

  # The C and Node bindings on Linux: the generated header is current, a C program built
  # with gcc runs against the shared library, and the Node tests and typings pass.
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: cargo test --locked -p push-sdk-c -p push-sdk-ffi
      - run: npm ci
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node
      - run: npm run typecheck
        working-directory: bindings/node

  # The tray app (its own workspace, apps/push-agent-tray) builds on Windows, and the
  # Windows-only tests run: the control channel's pipe ACL and peer check, and the locked
  # exe probe.
  tray-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "apps/push-agent-tray -> target"
      - run: cargo clippy --manifest-path apps/push-agent-tray/Cargo.toml --locked -- -D warnings
      - run: cargo build --manifest-path apps/push-agent-tray/Cargo.toml --release --locked
      - run: cargo test -p push-bridge-control -p push-tray-core -p push-bridge --locked --lib
      # The window page renders the chat peek as text only.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node --test apps/push-agent-tray/tests/chat.test.js

  # The browser smoke test of voice calls (docs/calls.md, "Browser smoke test"): the
  # whole stack in process with calls on, the example page docs/examples/calls, and
  # Playwright with two Chromium contexts and fake media devices calling each other,
  # once through stun-only and once relay-only through the chart's pinned coturn.
  browser-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/examples/calls/tests/package-lock.json
      - run: npm ci
        working-directory: docs/examples/calls/tests
      - run: npx playwright install --with-deps chromium
        working-directory: docs/examples/calls/tests
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo test -p push-smoke --test browser_calls --locked -- --nocapture
        env:
          PUSH_BROWSER_CALLS: "1"

  # The media helper's smoke test (docs/calls.md, "Media helper"): the whole stack in
  # process with calls on and two push-sdk clients with MediaCall (feature calls-media)
  # exchanging tones, once over host candidates (stun-only) and twice relay-only through
  # the chart's pinned coturn (TURN over UDP and over TCP).
  calls-media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo test -p push-smoke --test calls_media --locked -- --nocapture --test-threads 1
        env:
          PUSH_CALLS_MEDIA: "1"

  # The agent bridge answers its owner's call end to end (docs/agent-bridge.md, "Voice
  # calls"): the whole stack in process with calls and agent-key sign-in, the owner on a
  # push-sdk client with MediaCall, the agent enrolled with a software key running the
  # bridge (feature voice) with a scripted backend, its speech in the scripted voice
  # adapter (push-voice-adapter-testkit, built first: the tests run its binary from the
  # target directory): greeting, prompt, spoken reply, barge-in, a voice approval, a
  # stranger refused, the hang-up, ask mode and the agent calling its owner.
  # bridge_voice_adapter covers the adapter's lifecycle: spawned and
  # connected, a crash mid-call and the restart, no adapter and a refused format (calls
  # not advertised), the final-transcript-to-speak latency and the playback's gaps.
  bridge-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo build -p push-voice-adapter-testkit --locked
      - run: cargo test -p push-smoke --test bridge_voice --locked -- --nocapture --test-threads 1
        env:
          PUSH_BRIDGE_VOICE: "1"
      - run: cargo test -p push-smoke --test bridge_voice_adapter --locked -- --nocapture --test-threads 1
        env:
          PUSH_BRIDGE_VOICE: "1"

  # The media helper builds on Windows (libopus and AWS-LC from source with MSVC and
  # CMake) and its unit tests pass there, two helpers talking over host candidates
  # included; so does the bridge's voice pipeline with the media helper.
  calls-media-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: "cargo test -p push-sdk --features calls-media --locked --lib -- media::"
      - run: "cargo test -p push-bridge --features voice --locked --lib -- voice::"

  # The container images build (nothing is pushed) and have no HIGH or CRITICAL
  # vulnerability with a fix (Trivy, current database; their Rust dependencies are also
  # checked by cargo-deny in supply-chain). Deploying them is verified on minikube before
  # merge: deploy/minikube/up.ps1 -Smoke.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the images
        run: |
          for target in auth message-svc gateway worker smoke load; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              -t "push-messenger/$target:ci" .
          done
      - name: Scan the images the chart deploys
        run: |
          for target in auth message-svc gateway worker smoke; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "push-messenger/$target:ci"
          done

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - run: python -m pip install --require-hashes --requirement deploy/helm/requirements-test.txt
      - run: pwsh deploy/helm/test-chart.ps1

  # The chart's manifests through a real API server's validation, which helm template
  # skips (an ipBlock the API refuses once broke helm upgrade): deploy/helm/test-chart-cluster.ps1
  # on kind, for the newest kindest/node image of each Kubernetes minor AKS supports. It
  # installs internal TURN in a namespace enforcing the restricted Pod Security Standard,
  # waits for coturn to be Ready (a crash loop once shipped) and runs a TURN allocation.
  chart-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.34.11
            digest: sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubernetes: v1.35.8
            digest: sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubernetes: v1.36.4
            digest: sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: v1.37.0
            digest: sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    name: chart-cluster (${{ matrix.kubernetes }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.kubernetes }}@${{ matrix.digest }}
          cluster_name: push-chart
          kubectl_version: ${{ matrix.kubernetes }}
          wait: 120s
      - run: pwsh deploy/helm/test-chart-cluster.ps1 -Context kind-push-chart

  # Every third-party image the chart deploys (deploy/helm/chart-images.sh: coturn, PostgreSQL,
  # Redis) is pinned by digest and has no HIGH or CRITICAL vulnerability with a fix, unless
  # accepted with a reason, a path and an expiry in deploy/helm/trivyignore/<name>.yaml.
  # Trivy downloads a current vulnerability database each run. The same scan runs weekly on
  # main (.github/workflows/image-rescan.yml); docs/calls.md, "Security updates of the
  # chart's images".
  chart-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - id: images
        run: echo "matrix=$(bash deploy/helm/chart-images.sh --matrix)" >> "$GITHUB_OUTPUT"

  image-scan:
    needs: chart-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.chart-images.outputs.matrix) }}
    name: image-scan (${{ matrix.image }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ matrix.ignorefile }}
          exit-code: "1"