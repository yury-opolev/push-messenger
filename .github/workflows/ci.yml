name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The integration tests start these images through the runner's Docker.
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo test --workspace --locked

  # The crates build with the oldest supported Rust (rust-version). Tests run on stable
  # above: their dev-dependencies (testcontainers) need a newer Rust, which consumers
  # never compile.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked

  # Known vulnerabilities, licences and sources of the Rust dependencies (deny.toml), and
  # known vulnerabilities of the Node binding's runtime dependencies.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm audit --omit=dev
        working-directory: bindings/node

  # The C and Node bindings on Linux: the generated header is current, a C program built
  # with gcc runs against the shared library, and the Node tests and typings pass.
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: cargo test --locked -p push-sdk-c -p push-sdk-ffi
      - run: npm ci
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node
      - run: npm run typecheck
        working-directory: bindings/node

  # The container images build (nothing is pushed). Deploying them is verified on
  # minikube before merge: deploy/minikube/up.ps1 -Smoke.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the images
        run: |
          for target in auth message-svc gateway worker smoke load; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              -t "push-messenger/$target:ci" .
          done

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - run: python -m pip install --require-hashes --requirement deploy/helm/requirements-test.txt
      - run: pwsh deploy/helm/test-chart.ps1
