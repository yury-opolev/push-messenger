name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The integration tests start these images through the runner's Docker.
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: docker pull postgres:17-alpine
      - run: docker pull redis:7-alpine
      - run: cargo test --workspace --locked

  # The C and Node bindings on Linux: the generated header is current, a C program built
  # with gcc runs against the shared library, and the Node tests and typings pass.
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: cargo test --locked -p push-sdk-c -p push-sdk-ffi
      - run: npm ci
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node
      - run: npm run typecheck
        working-directory: bindings/node

  # The container images build (nothing is pushed). Deploying them is verified on
  # minikube before merge: deploy/minikube/up.ps1 -Smoke.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          for target in auth message-svc gateway worker smoke; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              -t "push-messenger/$target:ci" .
          done

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: python -m pip install --requirement deploy/helm/requirements-test.txt
      - run: pwsh deploy/helm/test-chart.ps1
