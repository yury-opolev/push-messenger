# Accepted findings of the Trivy scan of the chart's pinned coturn image
# (calls.turn.internal.image; the coturn-image job of .github/workflows/ci.yml). Each entry
# says why it does not apply to coturn as the chart runs it and expires, so it is reviewed
# again. Prefer moving to a coturn release that fixes it (docs/calls.md, "Upgrading
# coturn"); add an entry only with a reason.
vulnerabilities:
  # bind-libs and bind-tools: the BIND resolver/server library and dig, used by the image's
  # optional detect-external-ip helper. The chart sets external-ip and never runs it;
  # coturn does no DNS resolution of peers.
  - id: CVE-2026-19630
    statement: BIND library/tools only; not used by turnserver with the chart's configuration
    expired_at: 2027-02-01
