  # brotli-libs: a decoder linked for libcurl/HTTP backends; coturn decodes no Brotli
  # content (no HTTP client use with the chart's configuration).
  - id: CVE-2026-111497
    statement: Brotli decoder; coturn decodes no Brotli data with the chart's configuration
    expired_at: 2027-02-01
  # libbson and mongo-c-driver: coturn's optional MongoDB user database. The chart uses
  # TURN REST credentials (use-auth-secret) and configures no database.
  - id: CVE-2026-84964
    statement: MongoDB driver; the chart configures no MongoDB user database
    expired_at: 2027-02-01
