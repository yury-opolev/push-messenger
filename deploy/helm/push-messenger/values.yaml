# Safe defaults. Authentication cannot be switched off from here: devMode stays off
# unless a values file sets both `devMode.enabled` and `devMode.acknowledge`, and the
# chart refuses dev mode for an ingress host that is not local (see _helpers.tpl).

images:
  # A non-empty digest (sha256: and 64 lowercase hex digits) renders repository@digest
  # and takes precedence over the tag, so consumers pin exactly what they built and
  # published. The chart never builds, logs in, pushes or checks a registry.
  auth:
    repository: push-messenger/auth
    tag: dev
    digest: ""
  messageSvc:
    repository: push-messenger/message-svc
    tag: dev
    digest: ""
  gateway:
    repository: push-messenger/gateway
    tag: dev
    digest: ""
  smoke:
    repository: push-messenger/smoke
    tag: dev
    digest: ""
  worker:
    repository: push-messenger/worker
    tag: dev
    digest: ""
  pullPolicy: IfNotPresent

# Changing this rolls out new auth, gateway, message-svc and worker pods even when the image tags
# stay the same (the bring-up script sets it after rebuilding the images).
buildId: ""

# DEV ONLY switches: the worker shows the emails its log sender delivered at /dev/mailbox
# (PUSH_DEV_MAILBOX=1), a webhook secret is generated when none is set, and `helm test`
# runs the smoke test. Never enable outside a local cluster.
devMode:
  enabled: false
  # Must be exactly "insecure-local-only" when enabled.
  acknowledge: ""

gateway:
  replicas: 1
  # Client ping interval announced in Ready, in milliseconds.
  heartbeatMs: 30000
  # Groups are not offered to apps in the first release (owner decision): the gateway
  # refuses group requests with NOT_AVAILABLE. message-svc keeps full group support;
  # true serves them.
  groups: false
  # Header with the client's IP for the per-IP limits, written by the controller in front
  # (its last line, then last entry, is used). Empty: the peer address. Only set one the
  # trusted proxy overwrites or appends to, with direct backend access blocked.
  clientIpHeader: ""
  # auth-svc's URL for its key set (GET /v1/auth/jwks). Empty: the in-cluster Service
  # over plain HTTP. Set an https:// URL when a mesh or a TLS-terminating Service fronts
  # auth-svc; the gateway trusts the system roots, or the bundle in SSL_CERT_FILE.
  authUrl: ""
  # 5 s preStop sleep + the gateway's own 10 s drain + margin.
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

auth:
  replicas: 1
  # 5 s preStop sleep + finishing the requests in progress (a password hash waits at
  # most 2 s for its turn) + margin.
  terminationGracePeriodSeconds: 30
  dbMaxConnections: 10
  # Password hashes computed at once; each takes 19 MiB (Argon2id, spec §5.6).
  hashConcurrency: 2
  # As gateway.clientIpHeader, for auth-svc's per-IP limits.
  clientIpHeader: ""
  # Empty: generated on install and kept on upgrades. The Ed25519 seed that signs access
  # tokens and the HMAC key of email links and registration tokens, base64 of 32 bytes.
  signingKey: ""
  linkKey: ""
  # Ways to sign in (docs/entra-sign-in.md, spec 2026-10-19).
  signIn:
    # password (default: email and password), entra (Microsoft Entra ID only), or
    # password,entra. With entra alone the worker sends no email (sender none), the email
    # and password routes answer 404 and the link pages are not routed. Switching to entra
    # alone signs every password device out when the new auth-svc pods start.
    providers: password
    # Read only when providers include entra.
    entra:
      # The API registration's application (client) id, optionally also its api://
      # identifier URI: one audience per entry (no commas), at most four.
      clientIds: []
      # Exactly one of [common], [organizations], [consumers], or one to twenty tenant ids.
      # A keyword lets anyone with such an account create an account here: the app
      # registration, user assignment and Conditional Access are then the only gate.
      tenants: []
      # https://login.microsoftonline.com/ or a sovereign cloud's host.
      authorityHost: https://login.microsoftonline.com/
      # The delegated scope tokens must carry; * accepts any scope of the API.
      requiredScope: access_as_user
      # An app role tokens must carry; empty: none.
      requiredRole: ""
      # Client app ids allowed to present tokens (azp); empty allows any.
      allowedClientApps: []
      # An Entra-backed device signs in with Entra ID again after this many hours (1-720).
      maxSessionHours: 24
      # A proxy for auth-svc's requests to Entra ID (HTTPS_PROXY); NO_PROXY keeps
      # in-cluster names direct. Empty: direct.
      httpsProxy: ""
      # A ConfigMap in the release namespace whose ca.crt auth-svc trusts instead of the
      # system roots (SSL_CERT_FILE) for every TLS connection it makes, e.g. a
      # TLS-inspecting proxy's root plus the public roots it needs. Empty: system roots.
      caConfigMap: ""
  admin:
    # Serves auth-svc's admin API (sign a user out of every device) on port 8082: never
    # through the chart's Ingresses, and only from networkPolicy.adminPeers (or a
    # kubectl port-forward). Its bearer token is the Secret's auth-admin-token: generated
    # for a chart-managed Secret, required in a consumer-managed one.
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

worker:
  # Workers share the queue, so more replicas are safe; dev mode needs exactly 1 (its
  # DEV ONLY mailbox is in memory, per replica), and the chart refuses more there.
  replicas: 1
  # 5 s preStop sleep (the webhook endpoint is behind the ingress) + the job in progress
  # (at most about 15 s) + giving back the jobs not started + margin.
  terminationGracePeriodSeconds: 30
  # Each of its two pools (its own database and auth-svc's outbox).
  dbMaxConnections: 5
  email:
    # log: logs each email instead of sending it. resend: sends through Resend, which
    # needs resendApiKey (or the resend-api-key of a consumer-managed Secret) and from.
    # none: no email at all, only with auth.signIn.providers entra (rendered then anyway).
    sender: log
    # The From of every email (owner decision: the push.kubegames.dk domain).
    from: "Push Messenger <no-reply@push.kubegames.dk>"
    # The name emails sign with.
    productName: Push Messenger
    # Resend's API key and the signing secret of its webhook (whsec_...): kept in the
    # chart-managed Secret. Consumers using secrets.existingSecret leave both empty.
    resendApiKey: ""
    webhookSecret: ""
    webhook:
      # Serves /v1/webhooks/resend: references resend-webhook-secret and, with chart
      # Ingress, renders its route. Never inferred from a live Secret. A disabled webhook
      # keeps a retained signing secret.
      enabled: false
  # Accounts left unverified this many days are deleted.
  unverifiedAccountDays: 7
  # Buried jobs, email records and delivery events are kept this many days.
  retentionDays: 30
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

messageSvc:
  replicas: 1
  terminationGracePeriodSeconds: 30
  dbMaxConnections: 10
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgres:
  # true: the bundled PostgreSQL below. false: an external server (postgres.external);
  # the bundled settings below are then unused.
  enabled: true
  # Pinned by digest (the multi-arch index of postgres:17-alpine), so every install runs
  # the same bytes; set another tag@digest to move.
  image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  # Bootstrap administrator password, used only by bundled PostgreSQL.
  # Empty: generated on install and kept on upgrades. Use letters and digits only.
  password: ""
  # Dedicated password for message-svc's non-superuser database owner, push_messaging.
  # Empty: generated on fresh install and kept on upgrades. ASCII letters/digits only.
  messagingPassword: ""
  # The password of auth-svc's own role, push_auth; the same rules.
  authPassword: ""
  # The password of the worker's own role, push_worker; the same rules.
  workerPassword: ""
  storage: 1Gi
  # Empty: the cluster's default storage class.
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # An external PostgreSQL (postgres.enabled false), e.g. Azure Database for PostgreSQL
  # flexible server: docs/deployment-azure-entra.md.
  external:
    host: ""
    port: 5432
    # azure-entra: Microsoft Entra ID tokens, no database credential anywhere. password:
    # the services read the URLs from a consumer-managed Secret (secrets.existingSecret).
    auth: azure-entra
    databases:
      messaging: push_messaging
      auth: push_auth
      worker: push_worker
    # azure-entra: each identity's PostgreSQL role name (its Entra principal name).
    users:
      messageSvc: ""
      auth: ""
      worker: ""
      # The migration Job's role (migrations.job.enabled).
      migrate: ""
    # A ConfigMap in the release namespace whose key ca.crt is a PEM bundle trusted
    # instead of the system roots. Empty: the system roots (Azure's public CAs).
    caConfigMap: ""

redis:
  # true: the bundled Redis below. false: an external one (redis.external).
  enabled: true
  # Pinned by digest (the multi-arch index of redis:7-alpine), like postgres.image.
  image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
  # Empty: generated on install and kept on upgrades. Letters and digits only.
  password: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # An external Redis (redis.enabled false), e.g. Azure Managed Redis (non-clustered or
  # Enterprise cluster policy): docs/deployment-azure-entra.md.
  external:
    # azure-entra: rediss://host:port (Azure Managed Redis: port 10000), no credentials.
    url: ""
    # azure-entra: Entra ID tokens. password: redis-url from a consumer-managed Secret.
    auth: azure-entra
    # The ACL user; empty: the token's oid (Azure Managed Redis).
    user: ""
    # As postgres.external.caConfigMap.
    caConfigMap: ""

# The workload identities of an Entra ID datastore (postgres.external.auth or
# redis.external.auth azure-entra). The chart creates one ServiceAccount per workload,
# <release>-<component>; the Azure identities and their federated credentials are the
# consumer's (docs/deployment-azure-entra.md).
azure:
  workloadIdentity:
    # Client ids of the user-assigned identities; distinct identities are allowed.
    clientIds:
      auth: ""
      messageSvc: ""
      gateway: ""
      worker: ""
      migrate: ""
    # webhook: the AKS workload-identity webhook projects the token and sets AZURE_*.
    # chart: the chart does both (clusters without the webhook; the local rehearsal).
    injection: webhook
    # injection chart only.
    tenantId: ""
    authorityHost: https://login.microsoftonline.com/
    # injection chart only: a ConfigMap whose ca.crt the services trust for the
    # authority (SSL_CERT_FILE), e.g. a TLS-inspecting proxy or the rehearsal issuer.
    authorityCaConfigMap: ""

serviceAccounts:
  # Extra annotations on every ServiceAccount the chart creates (Entra ID mode only).
  annotations: {}

migrations:
  job:
    # A pre-install/pre-upgrade Job migrates as azure.workloadIdentity.clientIds.migrate
    # and grants the runtime identities; the services then skip migrations. Needs an
    # external PostgreSQL with Entra ID.
    enabled: false
    backoffLimit: 3

# Credentials. Empty existingSecret: the chart generates them on install and keeps them
# (push-secrets, helm.sh/resource-policy: keep). A name: references that consumer-managed
# Secret in the release namespace (key contract: docs/deployment-configuration.md); the chart
# then never creates, reads, changes or deletes it, and refuses inline credential values.
secrets:
  existingSecret: ""

# Ingress isolation for the application components (the bundled datastores' policies
# only when they are enabled); egress is unrestricted unless egress.enabled.
# Requires a NetworkPolicy-enforcing CNI (render checks alone cannot prove enforcement).
networkPolicy:
  enabled: true
  # Empty denies public traffic until the actual controller's selectors are configured.
  # Each peer must have BOTH non-empty label maps, ANDed in one source:
  # - namespaceSelector: {example.com/namespace: edge}
  #   podSelector: {example.com/controller: public}
  ingressControllerPeers: []
  # Peers allowed to reach auth-svc's admin port 8082 (auth.admin.enabled), each with both
  # non-empty label maps, like ingressControllerPeers. Empty: nobody (kubectl
  # port-forward still works).
  adminPeers: []
  egress:
    # Adds Egress rules to every application policy: DNS, the release's own peers, the
    # datastores and HTTPS. Off: egress is not restricted (as before).
    enabled: false
    # Peers allowed on port 53 (UDP and TCP), each with both non-empty label maps.
    dns:
      - namespaceSelector:
          kubernetes.io/metadata.name: kube-system
        podSelector:
          k8s-app: kube-dns
    # CIDRs of the external datastores' private endpoints, on postgres.external.port and
    # the port of redis.external.url (6379 without one). The bundled datastores are
    # reached by their pods' labels instead and get no egress themselves.
    postgresCidrs: []
    redisCidrs: []
    # CIDRs allowed on port 443 for token requests (Entra ID) and anything else HTTPS
    # the services call (the worker's Resend API).
    httpsCidrs: []
    # CIDRs auth-svc alone may reach on 443 for Microsoft Entra ID sign-in
    # (auth.signIn.providers with entra): the AzureActiveDirectory service tag ranges. A
    # proxy (auth.signIn.entra.httpsProxy) needs a rule of its own in extra instead.
    entraSignInCidrs: []
    # Raw NetworkPolicyEgressRule objects added to every application policy.
    extra: []

ingress:
  enabled: true
  # Empty omits spec.ingressClassName (the cluster's default class).
  className: ""
  # The public host. Kept as the public identity also with enabled: false, for consumer
  # routes (e.g. Gateway API): email links start with `<scheme>://<host>` and access
  # tokens name the gateway at `ws[s]://<host>/v1/socket`.
  host: push.example.com
  # Plain http is accepted only for a local host.
  scheme: https
  tls:
    # An existing kubernetes.io/tls Secret in the release namespace, provisioned by the
    # consumer; used by every public route with https. The chart never generates one.
    secretName: push-tls
  # String-valued annotations for the consumer's controller. `annotations` goes on every
  # public Ingress; a per-route key overrides a common one. authLinkAnnotations applies
  # only to the token-bearing email link routes (e.g. to keep tokens out of access logs).
  annotations: {}
  gatewayAnnotations: {}
  authAnnotations: {}
  authLinkAnnotations: {}
  webhookAnnotations: {}

smoke:
  # Helm test: DEV mode, or operator Entra accounts from a consumer-managed Secret.
  # The Secret must hold exactly two preexisting identities in entraAccountsKey (JSONL).
  # Relative entra_token_file paths name other keys mounted from the same Secret.
  # No service signing key or DEV mailbox is made available in operator mode.
  entraAccountsSecret: ""
  entraAccountsKey: accounts.jsonl
  # Defaults name minikube's local ingress-nginx addon; override for your controller.
  # auth-svc's public API as the smoke test reaches it: the ingress controller, with
  # `ingress.host` as the Host header.
  authUrl: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local
  # The WebSocket URL the smoke test connects to: the ingress controller inside the
  # cluster, with `ingress.host` as the Host header, so the test goes through the
  # ingress like a client.
  socketUrl: ws://ingress-nginx-controller.ingress-nginx.svc.cluster.local/v1/socket
  # DEV ONLY: the rehearsal issuer's token endpoint
  # (deploy/minikube/entra-sign-in-rehearsal.ps1); the smoke test then signs in with
  # Microsoft Entra ID tokens instead of email and password.
  entraTokenUrl: ""
