{{- $name := include "push.name" (dict "root" . "component" "auth") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "auth") | nindent 4 }}
spec:
  selector:
    {{- include "push.selector" (dict "root" . "component" "auth") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if .Values.auth.admin.enabled }}
    # The admin API. Never named in an Ingress: they route the port named http only.
    - name: admin
      port: 8082
      targetPort: admin
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "auth") | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      {{- include "push.selector" (dict "root" . "component" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "push.labels" (dict "root" . "component" "auth") | nindent 8 }}
        {{- with include "push.identityLabels" (dict "root" . "key" "auth") }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      {{- with .Values.buildId }}
      annotations:
        push-messenger/build-id: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with include "push.serviceAccount" (dict "root" . "component" "auth") }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      # Shutdown budget, as for the gateway: the 5 s preStop sleep lets Kubernetes take
      # the pod out of the Service and Ingress endpoints before SIGTERM, on which
      # auth-svc stops accepting, finishes the requests in progress and closes its pool.
      # Native sleep action: the image has no shell.
      terminationGracePeriodSeconds: {{ .Values.auth.terminationGracePeriodSeconds }}
      containers:
        - name: auth
          image: {{ include "push.image" .Values.images.auth }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "push.containerSecurity" . | nindent 10 }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            {{- with include "push.identityEnv" (dict "root" . "key" "auth") }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            # Its own database only: auth-svc never sees message-svc's credentials.
            {{- include "push.postgresEnv" (dict "root" . "secretKey" "auth-database-url" "database" .Values.postgres.external.databases.auth "user" .Values.postgres.external.users.auth) | trim | nindent 12 }}
            {{- include "push.redisEnv" . | trim | nindent 12 }}
            - name: PUSH_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: auth-signing-key
            - name: PUSH_AUTH_LINK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: auth-link-key
            # Email links are built from this, never from a request's Host header.
            - name: PUSH_AUTH_PUBLIC_URL
              value: {{ include "push.publicUrl" . | quote }}
            - name: PUSH_AUTH_TOKEN_AUDIENCE
              value: {{ include "push.socketUrl" . | quote }}
            {{- with .Values.auth.clientIpHeader }}
            # Written by the trusted controller in front; see values.yaml.
            - name: PUSH_AUTH_CLIENT_IP_HEADER
              value: {{ . | quote }}
            {{- end }}
            - name: PUSH_AUTH_HASH_CONCURRENCY
              value: {{ .Values.auth.hashConcurrency | quote }}
            - name: PUSH_DB_MAX_CONNECTIONS
              value: {{ .Values.auth.dbMaxConnections | quote }}
            # The role the worker connects as: auth-svc grants it auth.outbox and the two
            # cleanup functions at start-up (the Postgres init script creates it).
            - name: PUSH_AUTH_WORKER_ROLE
              value: {{ if include "push.entraPostgres" . }}{{ .Values.postgres.external.users.worker | quote }}{{ else }}push_worker{{ end }}
            # GET /v1/users?ids=… asks message-svc's Directory API whose profiles the
            # caller may see, with auth-svc's own token.
            - name: PUSH_MESSAGE_SVC_URL
              value: {{ printf "http://%s:50053" (include "push.name" (dict "root" . "component" "message-svc")) | quote }}
            - name: PUSH_DIRECTORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: directory-token
            {{- with (include "push.signInEnv" . | trim) }}
            # Sign-in beyond email and password (auth.signIn, docs/entra-sign-in.md).
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.auth.admin.enabled }}
            # The admin API on its own listener, reachable only from networkPolicy.adminPeers.
            - name: PUSH_AUTH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: auth-admin-token
            - name: PUSH_AUTH_ADMIN_ADDR
              value: "0.0.0.0:8082"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
            {{- if .Values.auth.admin.enabled }}
            - name: admin
              containerPort: 8082
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          {{- with (printf "%s%s" (include "push.identityMounts" (dict "root" . "key" "auth" "postgres" true "redis" true)) (include "push.signInMounts" .)) | trim }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (printf "%s%s" (include "push.identityVolumes" (dict "root" . "key" "auth" "postgres" true "redis" true)) (include "push.signInVolumes" .)) | trim }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
