{{- if .Values.postgres.enabled -}}
{{- /*
Runs once, when PostgreSQL initialises an empty data volume (/docker-entrypoint-initdb.d):
creates each service's own role and database ownership (one database per service,
spec §2), in file name order. The passwords come from the environment, which reads them
from the Secret; this ConfigMap holds no credentials. Existing installations need the
data-preserving operator upgrade in docs/deployment-upgrade.md; do not delete their volumes.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "push.name" (dict "root" . "component" "postgres-init") }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "postgres") | nindent 4 }}
data:
  05-push-messaging.sh: |
    # Sourced by the entrypoint after it creates push_messaging, before app migrations.
    # Suppress SQL error details in both client and server logs: CREATE ROLE has a secret.
    if ! psql -X -q -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres 2>/dev/null <<'SQL'
    SET log_statement = 'none';
    SET log_min_error_statement = 'panic';
    \getenv password PUSH_MESSAGING_DB_PASSWORD
    SELECT :'password' ~ '^[A-Za-z0-9]+$' AS valid_password \gset
    \if :valid_password
    SELECT format('CREATE ROLE push_messaging LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'password') \gexec
    ALTER DATABASE push_messaging OWNER TO push_messaging;
    \else
    \echo Invalid PUSH_MESSAGING_DB_PASSWORD: use only ASCII letters and digits.
    DO $invalid$ BEGIN RAISE EXCEPTION 'Invalid messaging database password'; END $invalid$;
    \endif
    SQL
    then
      echo 'Messaging database bootstrap failed; SQL details withheld to protect credentials.' >&2
      exit 1
    fi
  10-push-auth.sh: |
    # Sourced by the image's entrypoint (bash) as the superuser, before the server opens.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      --set=password="$PUSH_AUTH_DB_PASSWORD" <<'SQL'
    CREATE ROLE push_auth LOGIN PASSWORD :'password';
    CREATE DATABASE push_auth OWNER push_auth;
    -- Revoking CONNECT from PUBLIC keeps push_auth out of push_messaging and every
    -- other service role out of push_auth. The bootstrap administrator bypasses it;
    -- message-svc instead owns only push_messaging as a non-superuser.
    REVOKE ALL ON DATABASE push_auth FROM PUBLIC;
    REVOKE ALL ON DATABASE push_messaging FROM PUBLIC;
    SQL
  20-push-worker.sh: |
    # The worker's role and database. It may also connect to push_auth, where auth-svc
    # grants it auth.outbox and two cleanup functions at start-up, and nothing else.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      --set=password="$PUSH_WORKER_DB_PASSWORD" <<'SQL'
    CREATE ROLE push_worker LOGIN PASSWORD :'password';
    CREATE DATABASE push_worker OWNER push_worker;
    REVOKE ALL ON DATABASE push_worker FROM PUBLIC;
    GRANT CONNECT ON DATABASE push_auth TO push_worker;
    SQL
{{- end }}
