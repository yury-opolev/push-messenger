{{- $name := include "push.name" (dict "root" . "component" "gateway") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "push.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "push.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "push.labels" (dict "root" . "component" "gateway") | nindent 8 }}
        {{- with include "push.identityLabels" (dict "root" . "key" "gateway") }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      {{- with .Values.buildId }}
      annotations:
        push-messenger/build-id: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with include "push.serviceAccount" (dict "root" . "component" "gateway") }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      # Shutdown budget: the 5 s preStop sleep, then SIGTERM, on which the gateway closes
      # every connection with 4005 and waits up to 10 s, plus margin. The sleep gives
      # Kubernetes time to take the pod out of the Service and Ingress endpoints before
      # the gateway closes its listener. The image has no shell, so it uses the native
      # sleep action (Kubernetes 1.30+; minikube runs 1.31) instead of `exec: sleep`.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: {{ include "push.image" .Values.images.gateway }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "push.containerSecurity" . | nindent 10 }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            {{- with include "push.identityEnv" (dict "root" . "key" "gateway") }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            - name: PUSH_MESSAGE_SVC_URL
              value: {{ printf "http://%s:50051" (include "push.name" (dict "root" . "component" "message-svc")) | quote }}
            # message-svc's Messaging API takes calls only with this token.
            {{- include "push.applicationEnv" (dict "root" . "name" "PUSH_MESSAGING_TOKEN" "key" "messaging-token") | nindent 12 }}
            {{- include "push.redisEnv" . | trim | nindent 12 }}
            - name: PUSH_HEARTBEAT_MS
              value: {{ .Values.gateway.heartbeatMs | quote }}
            # Access tokens are checked against auth-svc's key set (GET /v1/auth/jwks)
            # and must name the gateway's public URL as their audience.
            - name: PUSH_AUTH_URL
              value: {{ .Values.gateway.authUrl | default (printf "http://%s:8080" (include "push.name" (dict "root" . "component" "auth"))) | quote }}
            - name: PUSH_TOKEN_AUDIENCE
              value: {{ include "push.socketUrl" . | quote }}
            {{- with .Values.gateway.clientIpHeader }}
            # Written by the trusted controller in front: the per-IP limits on redeeming
            # invites and contact requests count by it; see values.yaml.
            - name: PUSH_CLIENT_IP_HEADER
              value: {{ . | quote }}
            {{- end }}
            - name: PUSH_GROUPS
              value: {{ ternary "1" "0" (eq (toString .Values.gateway.groups) "true") | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          {{- with (printf "%s%s" (include "push.identityMounts" (dict "root" . "key" "gateway" "postgres" false "redis" true)) (include "push.applicationMounts" .)) }}
          volumeMounts:
            {{- . | trim | nindent 12 }}
          {{- end }}
      {{- with (printf "%s%s" (include "push.identityVolumes" (dict "root" . "key" "gateway" "postgres" false "redis" true)) (include "push.applicationVolumes" .)) }}
      volumes:
        {{- . | trim | nindent 8 }}
      {{- end }}
