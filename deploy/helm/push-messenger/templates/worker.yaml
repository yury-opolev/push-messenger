{{- $name := include "push.name" (dict "root" . "component" "worker") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  selector:
    {{- include "push.selector" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "push.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "push.labels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with include "push.identityLabels" (dict "root" . "key" "worker") }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      {{- with .Values.buildId }}
      annotations:
        push-messenger/build-id: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with include "push.serviceAccount" (dict "root" . "component" "worker") }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      # The webhook endpoint is behind the ingress: the 5 s preStop sleep lets Kubernetes
      # take the pod out of its endpoints before SIGTERM, on which the worker finishes the
      # job in progress, gives back the jobs it claimed but did not start (another replica
      # takes them at once) and stops. Native sleep action: the image has no shell.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "push.image" .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "push.containerSecurity" . | nindent 10 }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            {{- with include "push.identityEnv" (dict "root" . "key" "worker") }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            # Its own database, and auth-svc's as a role that may only drain the outbox
            # and call two cleanup functions; never message-svc's database.
            {{- include "push.postgresEnv" (dict "root" . "secretKey" "worker-database-url" "database" .Values.postgres.external.databases.worker "user" .Values.postgres.external.users.worker) | trim | nindent 12 }}
            {{- if include "push.entraPostgres" . }}
            # auth-svc's database on the same server, as the same principal.
            - name: PUSH_AUTH_DATABASE_NAME
              value: {{ .Values.postgres.external.databases.auth | quote }}
            {{- else }}
            - name: PUSH_AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: worker-auth-database-url
            {{- end }}
            - name: PUSH_MESSAGE_SVC_URL
              value: {{ printf "http://%s:50052" (include "push.name" (dict "root" . "component" "message-svc")) | quote }}
            - name: PUSH_ACCOUNTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: accounts-token
            {{- /* none when email and password sign-in is off: nothing writes an email then. */}}
            - name: PUSH_EMAIL_SENDER
              value: {{ include "push.emailSender" . | quote }}
            - name: PUSH_EMAIL_FROM
              value: {{ .Values.worker.email.from | quote }}
            - name: PUSH_EMAIL_PRODUCT_NAME
              value: {{ .Values.worker.email.productName | quote }}
            {{- if eq .Values.worker.email.sender "resend" }}
            - name: PUSH_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: resend-api-key
            {{- end }}
            {{- if include "push.hasWebhook" . }}
            - name: PUSH_RESEND_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: resend-webhook-secret
            {{- end }}
            - name: PUSH_UNVERIFIED_ACCOUNT_DAYS
              value: {{ .Values.worker.unverifiedAccountDays | quote }}
            - name: PUSH_WORKER_RETENTION_DAYS
              value: {{ .Values.worker.retentionDays | quote }}
            - name: PUSH_DB_MAX_CONNECTIONS
              value: {{ .Values.worker.dbMaxConnections | quote }}
            - name: PUSH_DEV_MAILBOX
              value: {{ include "push.mailboxFlag" . | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with include "push.identityMounts" (dict "root" . "key" "worker" "postgres" true "redis" false) }}
          volumeMounts:
            {{- . | trim | nindent 12 }}
          {{- end }}
      {{- with include "push.identityVolumes" (dict "root" . "key" "worker" "postgres" true "redis" false) }}
      volumes:
        {{- . | trim | nindent 8 }}
      {{- end }}
