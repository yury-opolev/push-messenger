{{- if .Values.networkPolicy.enabled -}}
{{- $controllers := .Values.networkPolicy.ingressControllerPeers -}}
{{- $peerError := "networkPolicy.ingressControllerPeers requires namespaceSelector and podSelector as non-empty label maps on every peer" -}}
{{- if not (kindIs "slice" $controllers) -}}
{{- fail $peerError -}}
{{- end -}}
{{- range $controllers -}}
{{- if not (kindIs "map" .) -}}
{{- fail $peerError -}}
{{- end -}}
{{- if or (not (kindIs "map" .namespaceSelector)) (not .namespaceSelector) (not (kindIs "map" .podSelector)) (not .podSelector) -}}
{{- fail $peerError -}}
{{- end -}}
{{- end -}}

{{- $gatewayRules := list -}}
{{- if $controllers -}}
{{- $gatewayRules = list (dict "port" 8080 "controllers" $controllers) -}}
{{- end -}}
{{- $workerControllers := list -}}
{{- if include "push.hasWebhook" . -}}
{{- $workerControllers = $controllers -}}
{{- end -}}
{{- $workerCallers := list -}}
{{- if include "push.devMode" . -}}
{{- $workerCallers = list "smoke" -}}
{{- end -}}
{{- $workerRules := list -}}
{{- if or $workerControllers $workerCallers -}}
{{- $workerRules = list (dict "port" 8080 "callers" $workerCallers "controllers" $workerControllers) -}}
{{- end -}}

{{- $policies := list
  (dict "component" "message-svc" "rules" (list
    (dict "port" 50051 "callers" (list "gateway"))
    (dict "port" 50052 "callers" (list "worker"))
    (dict "port" 50053 "callers" (list "auth"))))
-}}
{{- if .Values.postgres.enabled -}}
{{- $policies = append $policies (dict "component" "postgres" "rules" (list
    (dict "port" 5432 "callers" (list "message-svc" "auth" "worker")))) -}}
{{- end -}}
{{- if .Values.redis.enabled -}}
{{- $policies = append $policies (dict "component" "redis" "rules" (list
    (dict "port" 6379 "callers" (list "message-svc" "auth" "gateway")))) -}}
{{- end -}}
{{- /* auth-svc's admin port: only the listed admin peers, never the ingress controllers. */ -}}
{{- $authRules := list (dict "port" 8080 "callers" (list "gateway") "controllers" $controllers) -}}
{{- if and .Values.auth.admin.enabled .Values.networkPolicy.adminPeers -}}
{{- $authRules = append $authRules (dict "port" 8082 "controllers" .Values.networkPolicy.adminPeers) -}}
{{- end -}}
{{- $policies = concat $policies (list
  (dict "component" "auth" "rules" $authRules)
  (dict "component" "gateway" "rules" $gatewayRules)
  (dict "component" "worker" "rules" $workerRules)) -}}

{{- /* Opt-in egress (networkPolicy.egress.enabled): DNS, the release's own peers, the
datastores (bundled: their pods; external: their CIDRs), HTTPS and extra rules. */ -}}
{{- $egress := .Values.networkPolicy.egress -}}
{{- $egressOf := dict -}}
{{- if $egress.enabled -}}
{{- if .Values.migrations.job.enabled -}}
{{- $policies = append $policies (dict "component" "migrate" "rules" (list)) -}}
{{- end -}}
{{- $postgresTo := list (dict "peer" "postgres" "port" 5432) -}}
{{- if not .Values.postgres.enabled -}}
{{- $postgresTo = list -}}
{{- range $egress.postgresCidrs -}}
{{- $postgresTo = append $postgresTo (dict "cidr" . "port" (int $.Values.postgres.external.port)) -}}
{{- end -}}
{{- end -}}
{{- $redisTo := list (dict "peer" "redis" "port" 6379) -}}
{{- if not .Values.redis.enabled -}}
{{- $found := regexFind ":[0-9]+/?$" (toString .Values.redis.external.url) | trimPrefix ":" | trimSuffix "/" -}}
{{- $redisPort := 6379 -}}
{{- if $found -}}
{{- $redisPort = int $found -}}
{{- end -}}
{{- $redisTo = list -}}
{{- range $egress.redisCidrs -}}
{{- $redisTo = append $redisTo (dict "cidr" . "port" $redisPort) -}}
{{- end -}}
{{- end -}}
{{- $https := list -}}
{{- range $egress.httpsCidrs -}}
{{- $https = append $https (dict "cidr" . "port" 443) -}}
{{- end -}}
{{- /* Microsoft Entra ID sign-in: auth-svc alone reaches its ranges. */ -}}
{{- $signIn := list -}}
{{- if include "push.entraSignIn" . -}}
{{- range $egress.entraSignInCidrs -}}
{{- $signIn = append $signIn (dict "cidr" . "port" 443) -}}
{{- end -}}
{{- end -}}
{{- $egressOf = dict
  "auth" (concat (list (dict "peer" "message-svc" "port" 50053)) $postgresTo $redisTo $https $signIn)
  "message-svc" (concat $postgresTo $redisTo $https)
  "gateway" (concat (list (dict "peer" "auth" "port" 8080) (dict "peer" "message-svc" "port" 50051)) $redisTo $https)
  "worker" (concat (list (dict "peer" "message-svc" "port" 50052)) $postgresTo $https)
  "migrate" (concat $postgresTo $https) -}}
{{- end -}}
{{- range $policies -}}
{{- $context := dict "root" $ "component" .component -}}
{{- printf "\n---\n" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- /* Keep the retained hook distinct from the legacy ordinary policy, which Helm deletes on upgrade. */}}
  name: {{ include "push.name" $context }}{{ if eq .component "migrate" }}-egress{{ end }}
  labels:
    {{- include "push.labels" $context | nindent 4 }}
  {{- if eq .component "migrate" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "push.selector" $context | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
    {{- end }}
  {{- if not .rules }}
  ingress: []
  {{- else }}
  ingress:
    {{- range .rules }}
    - ports:
        - protocol: TCP
          port: {{ .port }}
      from:
        {{- range .callers }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              push-messenger/network-peer: {{ . }}
        {{- end }}
        {{- range .controllers }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if $egress.enabled }}
  {{- if has .component (list "postgres" "redis") }}
  # The bundled datastores call nothing.
  egress: []
  {{- else }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        {{- range $egress.dns }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
        {{- end }}
    {{- range index $egressOf .component }}
    - ports:
        - protocol: TCP
          port: {{ .port }}
      to:
        {{- if .peer }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              push-messenger/network-peer: {{ .peer }}
        {{- else }}
        - ipBlock:
            cidr: {{ .cidr }}
        {{- end }}
    {{- end }}
    {{- with $egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
