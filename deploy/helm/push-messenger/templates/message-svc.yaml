{{- $name := include "push.name" (dict "root" . "component" "message-svc") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "message-svc") | nindent 4 }}
spec:
  selector:
    {{- include "push.selector" (dict "root" . "component" "message-svc") | nindent 4 }}
  ports:
    - name: messaging
      port: 50051
      targetPort: messaging
      appProtocol: grpc
    - name: accounts
      port: 50052
      targetPort: accounts
      appProtocol: grpc
    - name: directory
      port: 50053
      targetPort: directory
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "message-svc") | nindent 4 }}
spec:
  replicas: {{ .Values.messageSvc.replicas }}
  selector:
    matchLabels:
      {{- include "push.selector" (dict "root" . "component" "message-svc") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "push.labels" (dict "root" . "component" "message-svc") | nindent 8 }}
        {{- with include "push.identityLabels" (dict "root" . "key" "messageSvc") }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      {{- with .Values.buildId }}
      annotations:
        push-messenger/build-id: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with include "push.serviceAccount" (dict "root" . "component" "message-svc") }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      # Set explicitly (the Kubernetes default is also 30 s) so a graceful stop is a
      # deliberate budget, not an accident.
      terminationGracePeriodSeconds: {{ .Values.messageSvc.terminationGracePeriodSeconds }}
      containers:
        - name: message-svc
          image: {{ include "push.image" .Values.images.messageSvc }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "push.containerSecurity" . | nindent 10 }}
          env:
            {{- with include "push.identityEnv" (dict "root" . "key" "messageSvc") }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            - name: PUSH_GRPC_ADDR
              value: "0.0.0.0:50051"
            - name: PUSH_ACCOUNTS_GRPC_ADDR
              value: "0.0.0.0:50052"
            - name: PUSH_DIRECTORY_GRPC_ADDR
              value: "0.0.0.0:50053"
            {{- include "push.postgresEnv" (dict "root" . "secretKey" "database-url" "database" .Values.postgres.external.databases.messaging "user" .Values.postgres.external.users.messageSvc) | trim | nindent 12 }}
            {{- include "push.redisEnv" . | trim | nindent 12 }}
            - name: PUSH_DB_MAX_CONNECTIONS
              value: {{ .Values.messageSvc.dbMaxConnections | quote }}
            # Only the worker has this token: the Accounts API refuses calls without it.
            - name: PUSH_ACCOUNTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: accounts-token
            # Only auth-svc has this one: the Directory API refuses calls without it.
            - name: PUSH_DIRECTORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: directory-token
            # Only the gateway has this one: the Messaging API refuses calls without it.
            - name: PUSH_MESSAGING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "push.secretName" . }}
                  key: messaging-token
          ports:
            - name: messaging
              containerPort: 50051
            - name: accounts
              containerPort: 50052
            - name: directory
              containerPort: 50053
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.messageSvc.resources | nindent 12 }}
          {{- with include "push.identityMounts" (dict "root" . "key" "messageSvc" "postgres" true "redis" true) }}
          volumeMounts:
            {{- . | trim | nindent 12 }}
          {{- end }}
      {{- with include "push.identityVolumes" (dict "root" . "key" "messageSvc" "postgres" true "redis" true) }}
      volumes:
        {{- . | trim | nindent 8 }}
      {{- end }}
