{{- if include "push.devMode" . -}}
# `helm test <release>` runs the end-to-end smoke test inside the cluster: auth-svc's public
# API and the WebSockets go through the ingress controller with the ingress host as the
# Host header, as a client's would; only the DEV ONLY mailbox is read straight from the
# worker, which the ingress does not route. It gets auth-svc's signing key from the Secret,
# to sign an expired token and one for another audience that the gateway must refuse. Its
# second half runs two apps built on push-sdk, whose SQLite databases live in an emptyDir
# (the root filesystem is read-only).
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "push.name" (dict "root" . "component" "smoke") }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "smoke") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: smoke
      image: {{ include "push.image" .Values.images.smoke }}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{- include "push.containerSecurity" . | nindent 6 }}
      args:
        - --auth
        - {{ .Values.smoke.authUrl | quote }}
        - --mailbox
        - {{ printf "http://%s:8080" (include "push.name" (dict "root" . "component" "worker")) | quote }}
        - --socket
        - {{ .Values.smoke.socketUrl | quote }}
        - --host
        - {{ .Values.ingress.host | quote }}
        - --data-dir
        - /data
        {{- with .Values.smoke.entraTokenUrl }}
        # DEV ONLY: the rehearsal issuer's token endpoint; the Entra ID smoke test runs.
        - --entra-token-url
        - {{ . | quote }}
        {{- end }}
      volumeMounts:
        - name: data
          mountPath: /data
      env:
        - name: PUSH_SMOKE_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "push.secretName" . }}
              key: auth-signing-key
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: data
      emptyDir:
        sizeLimit: 64Mi
{{- end }}
