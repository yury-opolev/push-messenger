{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "push.name" (dict "root" . "component" "gateway") }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "gateway") | nindent 4 }}
  annotations:
    # ingress-nginx passes the WebSocket upgrade through by itself; what it needs is
    # longer timeouts than its 60 s default, so idle sockets between client pings
    # survive (spec §7.5).
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.timeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.timeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /v1/socket
            pathType: Exact
            backend:
              service:
                name: {{ include "push.name" (dict "root" . "component" "gateway") }}
                port:
                  name: http
---
# auth-svc's public API (spec §2): /v1/auth, /v1/devices and /v1/users.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "push.name" (dict "root" . "component" "auth") }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "auth") | nindent 4 }}
  annotations:
    # Requests are small JSON bodies.
    nginx.ingress.kubernetes.io/proxy-body-size: 16k
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range list "/v1/auth" "/v1/devices" "/v1/users" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "push.name" (dict "root" $ "component" "auth") }}
                port:
                  name: http
          {{- end }}
---
# The email link pages carry a one-time token in the query string (?token=). They get an
# Ingress of their own with the access log off, so the token never reaches ingress-nginx's
# logs; the Exact paths win over the Prefix paths of the Ingress above. A separate
# Ingress rather than a configuration-snippet, which ingress-nginx refuses by default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "push.name" (dict "root" . "component" "auth-links") }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "auth") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 16k
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range list "/v1/auth/verify" "/v1/auth/password/reset" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "push.name" (dict "root" $ "component" "auth") }}
                port:
                  name: http
          {{- end }}
{{- if include "push.hasWebhook" . }}
---
# Resend's delivery webhooks (spec §9), the worker's only public path: one Exact path, so
# its DEV ONLY /dev/mailbox is never routed. The worker checks each request's Svix
# signature and refuses timestamps more than 5 minutes off.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "push.name" (dict "root" . "component" "worker") }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "worker") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 256k
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /v1/webhooks/resend
            pathType: Exact
            backend:
              service:
                name: {{ include "push.name" (dict "root" . "component" "worker") }}
                port:
                  name: http
{{- end }}
{{- end }}
