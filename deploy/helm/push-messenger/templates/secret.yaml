{{- /*
Chart-managed credentials only; with secrets.existingSecret this whole template renders
nothing and never looks the Secret up.
Passwords come from values, or are generated on install and read back from the existing
Secret on upgrades (`lookup`), so they never change and never live in git. The URLs embed
them, so the services read the URLs from this Secret too, never from a ConfigMap.
*/ -}}
{{- include "push.checkSecretSelection" . -}}
{{- if not .Values.secrets.existingSecret -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "push.secretName" .) -}}
{{- $existing := $existingSecret.data | default dict -}}
{{- if and .Values.postgres.enabled $existingSecret (not (get $existing "messaging-db-password")) -}}
{{- fail "Existing Secret has no messaging-db-password: follow the data-preserving upgrade instructions in docs/deployment-upgrade.md before upgrading; do not delete its volume." -}}
{{- end -}}
{{- $postgresPassword := "" -}}
{{- $messagingPassword := "" -}}
{{- $authPassword := "" -}}
{{- $workerPassword := "" -}}
{{- $redisPassword := "" -}}
{{- if .Values.postgres.enabled -}}
{{- $postgresPassword = .Values.postgres.password | default (get $existing "postgres-password" | b64dec) | default (randAlphaNum 32) -}}
{{- $messagingPassword = .Values.postgres.messagingPassword | default (get $existing "messaging-db-password" | b64dec) | default (randAlphaNum 32) -}}
{{- if not (regexMatch "^[A-Za-z0-9]+$" $messagingPassword) -}}
{{- fail "postgres.messagingPassword / messaging-db-password must contain only ASCII letters and digits" -}}
{{- end -}}
{{- $authPassword = .Values.postgres.authPassword | default (get $existing "auth-db-password" | b64dec) | default (randAlphaNum 32) -}}
{{- $workerPassword = .Values.postgres.workerPassword | default (get $existing "worker-db-password" | b64dec) | default (randAlphaNum 32) -}}
{{- end -}}
{{- if .Values.redis.enabled -}}
{{- $redisPassword = .Values.redis.password | default (get $existing "redis-password" | b64dec) | default (randAlphaNum 32) -}}
{{- end -}}
{{- $accountsToken := get $existing "accounts-token" | b64dec | default (randAlphaNum 48) -}}
{{- $directoryToken := get $existing "directory-token" | b64dec | default (randAlphaNum 48) -}}
{{- $messagingToken := get $existing "messaging-token" | b64dec | default (randAlphaNum 48) -}}
{{- $adminToken := get $existing "auth-admin-token" | b64dec | default (randAlphaNum 48) -}}
{{- /* Resend's credentials come from values or are kept from the existing Secret; a local
cluster gets a generated webhook secret, so the webhook path can be tried with signed
requests (not without email and password sign-in: no email, no webhook). Consumers
delivering their own credentials use secrets.existingSecret. */ -}}
{{- $resendApiKey := .Values.worker.email.resendApiKey | default (get $existing "resend-api-key" | b64dec) -}}
{{- $webhookSecret := .Values.worker.email.webhookSecret | default (get $existing "resend-webhook-secret" | b64dec) -}}
{{- if and (not $webhookSecret) (include "push.devMode" .) (not (include "push.emailOff" .)) -}}
{{- $webhookSecret = printf "whsec_%s" (randBytes 32) -}}
{{- end -}}
{{- /* The auth keys are base64 of 32 random bytes; randBytes returns exactly that. */ -}}
{{- $signingKey := .Values.auth.signingKey | default (get $existing "auth-signing-key" | b64dec) | default (randBytes 32) -}}
{{- $linkKey := .Values.auth.linkKey | default (get $existing "auth-link-key" | b64dec) | default (randBytes 32) -}}
{{- include "push.checkAuthKey" (dict "name" "auth.signingKey / auth-signing-key" "value" $signingKey "exact" true) -}}
{{- include "push.checkAuthKey" (dict "name" "auth.linkKey / auth-link-key" "value" $linkKey "exact" false) -}}
{{- $postgresHost := include "push.name" (dict "root" . "component" "postgres") -}}
{{- $redisHost := include "push.name" (dict "root" . "component" "redis") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "push.secretName" . }}
  annotations:
    # Kept when an install fails or the release is uninstalled, so the next install finds
    # it with `lookup` and reuses the password the Postgres volume was initialised with.
    # The meta.helm.sh annotations and the managed-by label let that install adopt it.
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "push.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ $postgresPassword | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ $redisPassword | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  # message-svc connects as the owner of push_messaging, so it can run its migrations.
  messaging-db-password: {{ $messagingPassword | quote }}
  database-url: {{ printf "postgres://push_messaging:%s@%s:5432/push_messaging" $messagingPassword $postgresHost | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-url: {{ printf "redis://:%s@%s:6379" $redisPassword $redisHost | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  # auth-svc connects as push_auth, the owner of its own database push_auth, created by
  # the Postgres init script (postgres-init.yaml). It cannot read push_messaging.
  auth-db-password: {{ $authPassword | quote }}
  auth-database-url: {{ printf "postgres://push_auth:%s@%s:5432/push_auth" $authPassword $postgresHost | quote }}
  {{- end }}
  auth-signing-key: {{ $signingKey | quote }}
  auth-link-key: {{ $linkKey | quote }}
  {{- if .Values.postgres.enabled }}
  # The worker connects to its own database as its owner, push_worker, and to auth-svc's
  # as the same role, which may only drain auth.outbox and call two cleanup functions
  # (auth-svc grants that at start-up). It never sees another service's credentials.
  worker-db-password: {{ $workerPassword | quote }}
  worker-database-url: {{ printf "postgres://push_worker:%s@%s:5432/push_worker" $workerPassword $postgresHost | quote }}
  worker-auth-database-url: {{ printf "postgres://push_worker:%s@%s:5432/push_auth" $workerPassword $postgresHost | quote }}
  {{- end }}
  # The worker's token for message-svc's Accounts API. The gateway, which can reach
  # message-svc too, does not get it, so it cannot register devices.
  accounts-token: {{ $accountsToken | quote }}
  # auth-svc's token for message-svc's Directory API (whose profiles a user may see). Only
  # auth-svc and message-svc get it; with the Accounts token it cannot register devices.
  directory-token: {{ $directoryToken | quote }}
  # The gateway's token for message-svc's Messaging API, which acts for whatever user and
  # device it is given. Only the gateway, which checks access tokens, and message-svc get it.
  messaging-token: {{ $messagingToken | quote }}
  {{- if .Values.auth.admin.enabled }}
  # auth-svc's admin API token (sign a user out of every device). Only auth-svc gets it;
  # operators read it from here to call the admin port.
  auth-admin-token: {{ $adminToken | quote }}
  {{- end }}
  {{- with $resendApiKey }}
  resend-api-key: {{ . | quote }}
  {{- end }}
  {{- with $webhookSecret }}
  resend-webhook-secret: {{ . | quote }}
  {{- end }}
{{- end }}
