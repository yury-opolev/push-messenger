# Local minikube only (deploy/minikube/up.ps1). Turns on the DEV ONLY mailbox the smoke
# test reads its emails from; the worker logs emails instead of sending them.

devMode:
  enabled: true
  acknowledge: insecure-local-only

# Existing local minikube controller only, not a production controller default.
networkPolicy:
  ingressControllerPeers:
    - namespaceSelector:
        kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        app.kubernetes.io/name: ingress-nginx

ingress:
  host: push.local
  scheme: http
