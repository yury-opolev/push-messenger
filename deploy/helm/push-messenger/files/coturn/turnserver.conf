# coturn's fixed settings for the chart's TURN relay (docs/calls.md, "TURN"). The chart
# appends the realm, relay ports, external IP, quotas, TLS settings and one
# denied-peer-ip line per range of denied-peers.txt and calls.turn.internal.deniedPeerCidrs.
# The shared secret is appended when the pod starts (an init container reads it from the
# Secret), so it is never part of a ConfigMap. The push-auth-core integration test starts
# coturn with this file too.
listening-port=3478
# TURN REST credentials: username "<expiry>:<user id>", password HMAC-SHA1 of the secret.
use-auth-secret
fingerprint
stale-nonce=600
no-software-attribute
# Relays reach public peers only: multicast and every range in denied-peers.txt are refused.
no-multicast-peers
# No NAT-behaviour discovery (RFC 5780): less to amplify. (coturn 4.18 has no CLI and no
# classic-STUN answers unless enabled.)
no-rfc5780
response-origin-only-with-rfc5780
# no-tcp-relay is deliberately not set: TCP relay (RFC 6062) stays available.
prometheus
log-file=stdout
simple-log
pidfile=/var/tmp/turnserver.pid
