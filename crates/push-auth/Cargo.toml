[package]
name = "push-auth"
description = "The push-messenger auth service: accounts, email links, devices and tokens."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The stub OpenID issuer and RSA test keys of Microsoft Entra ID sign-in, for tests in
# other crates (push-smoke). Never enabled by a service binary.
testing = []

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
push-credentials.workspace = true
push-proto.workspace = true
push-store.workspace = true
rand.workspace = true
redis.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-stream.workspace = true
tower.workspace = true

[lints]
workspace = true
