[package]
name = "push-auth"
description = "The push-messenger auth service: push-auth-core with the built-in sign-in."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
push-auth-core.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
push-auth-core = { workspace = true, features = ["testing"] }
serde_json.workspace = true

# A push-auth of one's own (spec 2026-10-19 pluggable identity, D10). Its tests run with
# `cargo test`; `cargo build -p push-auth` (the image) never builds it.
[[example]]
name = "custom_identity"
test = true

[lints]
workspace = true
