[package]
name = "push-voice-adapter-testkit"
description = "A scripted voice adapter (push-voice-adapter/1) for tests: tones in, transcripts out; text in, a tone out; faults on demand. Library and binary."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
push-bridge-control.workspace = true
push-voice-adapter-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "test-util", "time"] }

[lints]
workspace = true
