[package]
name = "push-sdk"
description = "The push-messenger client core: sign-in, the connection, the local store, the outbox and one event stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The test doubles (`testing`) and the `push-sdk-fakes` binary, for the bindings' tests.
# Never for an app.
testing = ["dep:axum"]

[[bin]]
name = "push-sdk-fakes"
required-features = ["testing"]

[dependencies]
# Argon2id for `DatabaseKey::derive`, as auth-svc hashes passwords.
argon2 = { workspace = true, features = ["zeroize"] }
axum = { workspace = true, optional = true }
# base64url and SHA-256 for agent-key assertions and key thumbprints.
base64.workspace = true
futures-util.workspace = true
push-domain.workspace = true
push-proto.workspace = true
rand.workspace = true
# HTTPS to auth-svc: rustls with ring and the webpki roots, no OpenSSL and no cmake.
reqwest = { workspace = true, features = ["rustls-tls"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# wss:// with rustls; ring is its provider through reqwest's rustls-tls.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[build-dependencies]
# SQLite3 Multiple Ciphers (build.rs): the vendored amalgamation in vendor/sqlite3mc,
# checked against the SHA-256s in its VERSION file, then compiled with `cc`.
cc = "1"
sha2.workspace = true

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
