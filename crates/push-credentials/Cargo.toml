[package]
name = "push-credentials"
description = "Datastore credentials for push-messenger: password URLs or Microsoft Entra ID tokens."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# DEV ONLY: the stub token issuer (also over TLS) and the datastore password helpers, for
# tests and the push-dev-entra rehearsal tool. Builds on the MSRV (1.85).
stub = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:sqlx", "dep:tokio-rustls", "dep:tower"]
# Plus the test CA and PostgreSQL and Redis containers with TLS: tests and examples only
# (testcontainers and rcgen's `time` need Rust 1.88).
testing = ["stub", "dep:rcgen", "dep:testcontainers-modules", "dep:uuid"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
futures-util.workspace = true
hyper = { workspace = true, optional = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["server-auto", "tokio"] }
rcgen = { workspace = true, optional = true }
redis.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
# The `stub` and `testing` modules also compile for this crate's own tests: a package
# cannot depend on itself to enable its features.
axum.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "tokio"] }
rcgen.workspace = true
sqlx.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-rustls.workspace = true
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true
