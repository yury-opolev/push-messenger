[package]
name = "push-bridge-control"
description = "The agent bridge's local control channel: wire protocol, instance endpoints and the per-user transport."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

# Not `workspace = true`: the workspace forbids unsafe code, and the Windows transport
# needs it for the pipe's security descriptor and the peer SID check.
[lints.rust]
# Only src/transport/windows.rs uses unsafe (Win32 FFI), each block with a SAFETY note.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
