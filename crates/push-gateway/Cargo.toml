[package]
name = "push-gateway"
description = "The push-messenger gateway: client WebSockets in front of message-svc."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
jsonwebtoken.workspace = true
prost.workspace = true
push-credentials.workspace = true
push-proto.workspace = true
redis.workspace = true
# HTTPS to auth-svc's key set when PUSH_AUTH_URL is https://: rustls with ring, trusting the
# system roots (SSL_CERT_FILE names a private CA bundle).
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream.workspace = true
# Only to recognise axum's WebSocket errors: the same version axum 0.8 uses.
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
push-auth.workspace = true
push-credentials = { workspace = true, features = ["testing"] }
push-domain.workspace = true
push-message-svc.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
