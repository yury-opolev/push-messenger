// The internal API of message-svc, called by the gateway (Messaging), the worker
// (Accounts) and auth-svc (Directory) (spec §2). Never exposed outside the cluster.
// Callers pass the user and device the gateway verified, or auth-svc announced;
// message-svc trusts them.
//
// Errors are gRPC statuses whose details (`grpc-status-details-bin`) follow gRPC's rich
// error model: a `google.rpc.Status` with the client's `push.v1.Error` packed as a
// `google.protobuf.Any` (type URL `type.googleapis.com/push.v1.Error`). The gateway
// forwards that error to the client.

syntax = "proto3";

package push.internal.v1;

import "push/v1/frame.proto";

service Messaging {
  // Confirms that the device is active and belongs to the user, and that the access token
  // is newer than the user's last password reset. A revoked device, or one of another
  // user, is PERMISSION_DENIED (UNKNOWN_DEVICE); a token issued no later than the second
  // of the last reset message-svc heard of is UNAUTHENTICATED (PASSWORD_CHANGED); a device
  // message-svc has never heard of is UNAVAILABLE (DEVICE_NOT_READY, retryable): auth-svc
  // registered it and the worker has not relayed it yet, which takes about a second.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
  // Appends a text message; answers after commit.
  rpc Send(SendRequest) returns (push.v1.SendAck);
  // Entries after the device's delivery positions, oldest first per conversation. A read:
  // it never moves a position. Positions move only on Ack (spec §4.7), so a Sync repeated
  // before the client acks returns the same entries again; a caller that syncs on every
  // notification skips the entries it already sent on the connection (the gateway does).
  rpc Sync(SyncRequest) returns (SyncResponse);
  // Records that the device holds everything up to a seq.
  rpc Ack(AckRequest) returns (AckResponse);
  // Changes the text of one of the user's messages; answers after commit with the edit
  // entry's SendAck.
  rpc Edit(EditRequest) returns (push.v1.SendAck);
  // Erases one of the user's messages; answers after commit with the delete entry's
  // SendAck.
  rpc Delete(DeleteRequest) returns (push.v1.SendAck);
  // Moves the user's read position in a conversation.
  rpc ReadUpTo(ReadUpToRequest) returns (ReadUpToResponse);
  // Any request frame (spec §7.1), on behalf of the user. The Response carries the
  // request's request_id, and so does the Error of a failed call.
  rpc Request(RequestCall) returns (push.v1.Response);
}

// auth-svc's user and device events, relayed by the worker from auth-svc's outbox
// (spec §2, §5.3). Delivery is at least once and in no particular order, so every call is
// idempotent and any order of calls ends in the same state. A device id that belongs to
// another user is PERMISSION_DENIED; malformed ids are INVALID_ARGUMENT; both are
// permanent. Storage problems are UNAVAILABLE or ABORTED: retry. Every call carries the
// shared internal token as `authorization: Bearer <token>` metadata; without it the call
// is UNAUTHENTICATED, so the gateway, which can reach message-svc, cannot register devices.
service Accounts {
  // user.verified: the user may use messaging.
  rpc UserVerified(AccountUser) returns (AccountsResponse);
  // device.registered: also records the user, since only verified users get devices.
  rpc DeviceRegistered(AccountDevice) returns (AccountsResponse);
  // device.revoked: Identify refuses the device from now on, even when this arrives
  // before the registration; the device is kicked (`kick:{device_id}`).
  rpc DeviceRevoked(AccountDevice) returns (AccountsResponse);
  // user.password_reset: every active device of the user is kicked
  // (`kick:{device_id}`), to sign in again, and Identify refuses the access tokens issued
  // no later than the second of `reset_at` (message-svc's own clock when it is 0). The
  // latest reset counts: a repeated or an older event moves nothing.
  rpc PasswordReset(AccountUser) returns (AccountsResponse);
}

// Whose profile a user may see (spec §5.5), for auth-svc's `GET /v1/users?ids=…`: auth-svc
// owns the profiles, message-svc the contacts and conversations. Every call carries
// auth-svc's own internal token as `authorization: Bearer <token>` metadata (not the
// worker's); without it the call is UNAUTHENTICATED.
service Directory {
  // The users among user_ids whose profile user_id may see: user_id itself, everyone it
  // shares or shared a conversation with, and the users it has a contact row for as it
  // sees them: requests it received, accepted contacts, and users it blocked, but only
  // those it could already see when it blocked them (blocking a stranger grants nothing).
  // A request user_id sent itself grants nothing, so someone it blocked cannot regain
  // sight of its profile by asking again. At most 100 ids; malformed ids are
  // INVALID_ARGUMENT.
  rpc VisibleUsers(VisibleUsersRequest) returns (VisibleUsersResponse);
}

message IdentifyRequest {
  bytes user_id = 1;
  bytes device_id = 2;
  // The access token's `iat`, in seconds since the Unix epoch.
  int64 issued_at = 3;
}

message IdentifyResponse {}

message SendRequest {
  bytes user_id = 1;
  bytes device_id = 2;
  push.v1.Send send = 3;
}

message SyncRequest {
  bytes device_id = 1;
  // At most this many entries; 0 means the server's maximum.
  uint32 limit = 2;
}

message SyncResponse {
  repeated push.v1.Deliver entries = 1;
  // More entries are waiting beyond this batch.
  bool more = 2;
}

message AckRequest {
  bytes device_id = 1;
  push.v1.Ack ack = 2;
}

message AckResponse {
  // Whether the device's position moved.
  bool moved = 1;
}

message EditRequest {
  bytes user_id = 1;
  bytes device_id = 2;
  push.v1.Edit edit = 3;
}

message DeleteRequest {
  bytes user_id = 1;
  bytes device_id = 2;
  push.v1.Delete delete = 3;
}

message ReadUpToRequest {
  bytes user_id = 1;
  push.v1.ReadUpTo read = 2;
}

message ReadUpToResponse {
  // Whether the user's read position moved.
  bool moved = 1;
}

message RequestCall {
  bytes user_id = 1;
  push.v1.Request request = 2;
}

// Published on the Redis channel `notify:{user_id}` after a commit (spec §4.3). Never
// carries message bodies: a lost notification only delays the client.
message Notification {
  oneof kind {
    // New log entries exist for the user; their devices should sync.
    EntriesAvailable entries_available = 1;
    ReceiptChanged receipt_changed = 2;
    ContactChanged contact_changed = 3;
    ReadPositionChanged read_position_changed = 4;
  }
}

message EntriesAvailable {}

message ReceiptChanged {
  bytes conversation_id = 1;
  oneof positions {
    DirectReceipt direct = 2;
    GroupReceipt group = 3;
  }
}

message DirectReceipt {
  bytes user_id = 1;
  int64 delivered_seq = 2;
  int64 read_seq = 3;
}

message GroupReceipt {
  int64 all_delivered_seq = 1;
  int64 all_read_seq = 2;
}

message ContactChanged {
  bytes peer_id = 1;
  push.v1.ContactState state = 2;
}

message ReadPositionChanged {
  bytes conversation_id = 1;
  int64 read_seq = 2;
}

// Published on the Redis channel `kick:{device_id}` (spec §5.3, §5.4): the gateway holding
// the device closes its socket at once (Plan 8). Never carries anything but the reason and
// the reset time.
message Kick {
  KickReason reason = 1;
  // PASSWORD_RESET: the reset, in seconds since the Unix epoch. A connection whose token
  // was issued after that second signed in after the reset and stays open.
  int64 reset_at = 2;
}

enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  // The device was revoked: the client stops (close code 4003).
  KICK_REASON_DEVICE_REVOKED = 1;
  // The user's password was reset: the client signs in again (close code 4001).
  KICK_REASON_PASSWORD_RESET = 2;
}

message AccountUser {
  bytes user_id = 1;
  // PasswordReset only: auth-svc's time of the reset, in seconds since the Unix epoch (the
  // clock of the tokens' `iat`); 0 for an event written before auth-svc sent it.
  int64 reset_at = 2;
}

message AccountDevice {
  bytes user_id = 1;
  bytes device_id = 2;
}

message AccountsResponse {}

message VisibleUsersRequest {
  bytes user_id = 1;
  repeated bytes user_ids = 2;
}

message VisibleUsersResponse {
  // Sorted, without duplicates.
  repeated bytes user_ids = 1;
}
