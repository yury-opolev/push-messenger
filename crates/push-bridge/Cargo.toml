[package]
name = "push-bridge"
description = "The agent bridge: reach a local AI coding agent (Coda first) from push-messenger as a private agent contact."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "push-agent-bridge"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
push-agent-key.workspace = true
push-bridge-control.workspace = true
push-domain.workspace = true
push-sdk.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Not `workspace = true`: the workspace forbids unsafe code, and the file version needs it.
[lints.rust]
# Only src/exe/windows.rs uses unsafe (version-info FFI), each block with a SAFETY note.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
